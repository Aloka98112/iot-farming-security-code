<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Irrigation Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 font-sans">

    <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-2xl text-center">
        <!-- Dashboard Title -->
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Smart Irrigation Dashboard</h1>

        <!-- Login Form Container -->
        <div id="login-container" class="transition-all duration-500 ease-in-out">
            <h2 class="text-2xl font-bold text-gray-700 mb-4">Login</h2>
            <div class="mb-4">
                <input type="text" id="username" placeholder="Username"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-6">
                <input type="password" id="password" placeholder="Password"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button id="login-button"
                    class="w-full px-6 py-2 bg-blue-600 text-white font-bold rounded-lg shadow-lg hover:bg-blue-700 transition-colors duration-200">
                Log In
            </button>
            <p id="login-message" class="mt-4 text-sm text-red-500 font-semibold"></p>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
